<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="256" height="256" rx="48" fill="#1B1C1F"/>
  <rect x="9" y="9" width="238" height="238" rx="41" fill="none" stroke="#C9A15C" stroke-width="3" opacity="0.45"/>
  <!-- A single bold calligraphic swash, thick-to-thin like a broad-nib pen
       stroke, with a small companion dot below (the way many Arabic-script
       letters pair a main stroke with a dot). Reads as "writing/script" in
       general rather than a specific letterform, which is safer to render
       correctly at icon scale than attempting real Nastaliq joining. -->
  <path d="M 96 190
           C 90 196 90 204 98 206
           C 108 208 118 200 126 190
           C 150 158 168 118 182 78
           C 185 69 180 61 171 60
           C 164 59 158 64 155 72
           C 138 116 122 152 100 182
           C 99 184 97 187 96 190 Z"
        fill="#C9A15C"/>
  <circle cx="86" cy="196" r="11" fill="#C9A15C"/>
</svg>
