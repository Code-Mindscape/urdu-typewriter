name: Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install Build Dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      # Validates version strings and saves clean versions to environment paths
      - name: Validate Tag against APP_VERSION
        id: version_check
        shell: bash
        run: |
          GIT_TAG="${GITHUB_REF#refs/tags/}"
          TAG_VERSION="${GIT_TAG#v}"
          
          CODE_VERSION=$(python -c "
          import re
          with open('main.py', 'r', encoding='utf-8') as f:
              content = f.read()
          match = re.search(r'APP_VERSION\s*=\s*[\'\"]([^\'\"]+)[\'\"]', content)
          if match:
              print(match.group(1))
          else:
              print('NOT_FOUND')
          ")
          
          echo "Pushed Git Tag Version: $TAG_VERSION"
          echo "Extracted App Version:  $CODE_VERSION"
          
          if [ "$TAG_VERSION" != "$CODE_VERSION" ]; then
            echo "::error::Version Mismatch! Git Tag ($GIT_TAG) does not match APP_VERSION ($CODE_VERSION) in main.py."
            exit 1
          fi
          echo "CLEAN_VERSION=$TAG_VERSION" >> $GITHUB_ENV

      - name: Compile Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --windowed --name UrduTypewriter --add-data "fonts;fonts" --add-data "icons;icons" main.py

      - name: Install Inno Setup Compiler
        run: choco install innosetup -y --no-progress

      # Python automatically rewrites line 6 in the ISS script to completely bypass terminal macro bugs
      - name: Dynamically Update Inno Setup Configuration Values
        shell: bash
        run: |
          mkdir -p release
          python -c "
          import os
          iss_path = 'installer/UrduTypewriter.iss'
          if not os.path.exists(iss_path):
              print('CRITICAL: Script missing!'); exit(1)
              
          with open(iss_path, 'r', encoding='utf-8') as f:
              lines = f.readlines()
              
          for i, line in enumerate(lines):
              if line.startswith('AppVersion='):
                  lines[i] = f'AppVersion={os.environ[\"CLEAN_VERSION\"]}\n'
                  print(f'Successfully injected version string directly: {lines[i].strip()}')
                  
          with open(iss_path, 'w', encoding='utf-8') as f:
              f.writelines(lines)
          "

      # Compiles cleanly without needing /D command line arguments anymore
      - name: Compile Setup Installer Wizard
        run: iscc installer\UrduTypewriter.iss

      - name: Generate GitHub Release Page
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe

