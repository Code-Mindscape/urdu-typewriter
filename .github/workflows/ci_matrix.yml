name: CI
on: [push, pull_request]

jobs:
  test-and-build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # Prevents Windows from being aborted if Linux hits an error
      matrix:
        os: [ubuntu-24.04, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # --- LINUX DOCKER EXECUTION ROUTE ---
      # Runs black and test files sequentially inside the built container environment
      - name: Run Code Style & Tests inside Docker (Ubuntu Only)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          docker build -t urdu-typewriter-test .
          echo "=== Running Code Style Check ==="
          docker run urdu-typewriter-test black --check .
          echo "=== Running Test Suite ==="
          docker run urdu-typewriter-test python -c "import glob, subprocess, sys; [subprocess.run([sys.executable, t], check=True) for t in glob.glob('test_*.py') if 'svg_copy' not in t.lower()]"

      # --- WINDOWS NATIVE EXECUTION ROUTE ---
      - uses: actions/setup-python@v5
        if: matrix.os == 'windows-latest'
        with: 
          python-version: "3.12" 
          cache: pip

      - name: Install Dependencies (Windows Only)
        if: matrix.os == 'windows-latest'
        run: |
          pip install -r requirements.txt
          pip install pyinstaller Pillow black

      - name: Ensure Asset Folders Exist (Windows Only)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p icons
          python -c "
          import os
          from PIL import Image
          if not os.path.exists('icons/appicon.png'): Image.new('RGBA', (256, 256), color=(0,0,0,0)).save('icons/appicon.png')
          if not os.path.exists('icons/appicon.ico'): Image.new('RGBA', (256, 256), color=(0,0,0,0)).save('icons/appicon.ico', format='ICO')
          "

      - name: Run Code Style Check & Tests (Windows Only)
        if: matrix.os == 'windows-latest'
        env: 
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
        run: |
          black --check .
          python -c "import glob, subprocess, sys; [subprocess.run([sys.executable, t], check=True) for t in glob.glob('test_*.py') if 'svg_copy' not in t.lower()]"

      # --- COMPILATION STEPS ---
      - name: Install PyInstaller on Linux Host for Build
        if: matrix.os == 'ubuntu-24.04'
        run: pip install pyinstaller Pillow && pip install -r requirements.txt

      - name: Build Application (Ubuntu)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          pyinstaller --name URDUTYPEWRITTER --windowed --onedir --clean --icon=icons/appicon.png --add-data "icons/appicon.png:icons" main.py

      - name: Build Application (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller --name URDUTYPEWRITTER --windowed --onedir --clean --icon=icons/appicon.ico --add-data "icons/appicon.ico;icons" main.py

      - name: Upload Built Application
        uses: actions/upload-artifact@v4
        with:
          name: URDUTYPEWRITTER-${{ matrix.os }}
          path: dist/URDUTYPEWRITTER/

