name: CI
on: [push, pull_request]

jobs:
  test-and-build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: 
          python-version: "3.12" 
          cache: pip

      - name: Install Linux System Dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3 fonts-dejavu-core ghostscript

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller Pillow

      # Safety Step: Ensures icons folder and basic image placeholders exist
      - name: Ensure Asset Folders Exist
        shell: bash
        run: |
          mkdir -p icons
          python -c "
          import os
          from PIL import Image
          if not os.path.exists('icons/appicon.png'):
              Image.new('RGBA', (256, 256), color=(0,0,0,0)).save('icons/appicon.png')
          if not os.path.exists('icons/appicon.ico'):
              Image.new('RGBA', (256, 256), color=(0,0,0,0)).save('icons/appicon.ico', format='ICO')
          "

      # Writes a global patch file on Windows that intercepts all unlinks across subprocesses
      - name: Configure Windows File-Lock Patch
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cat << 'EOF' > patch_win_unlink.py
          import pathlib
          original_unlink = pathlib.Path.unlink
          def safe_unlink(self, missing_ok=False):
              try:
                  original_unlink(self, missing_ok=missing_ok)
              except PermissionError:
                  pass
          pathlib.Path.unlink = safe_unlink
          EOF
          echo "Global Windows process patch file generated."

      # Runs your verification suite uniformly across both systems
      # PYTHONSTARTUP forces every spawned test subprocess to inherit the unlink override
      - name: Run Tests
        env: 
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
          PYTHONSTARTUP: ${{ matrix.os == 'windows-latest' && 'patch_win_unlink.py' || '' }}
        run: |
          python -c "import glob, subprocess, sys; [subprocess.run([sys.executable, t], check=True) for t in glob.glob('test_*.py')]"

      # Linux Build Step
      - name: Build Application (Ubuntu)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          pyinstaller --name URDUTYPEWRITTER --windowed --onedir --clean --icon=icons/appicon.png --add-data "icons/appicon.png:icons" main.py

      # Windows Build Step
      - name: Build Application (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller --name URDUTYPEWRITTER --windowed --onedir --clean --icon=icons/appicon.ico --add-data "icons/appicon.ico;icons" main.py

      # Packages and uploads the build folders safely
      - name: Upload Built Application
        uses: actions/upload-artifact@v4
        with:
          name: URDUTYPEWRITTER-${{ matrix.os }}
          path: dist/URDUTYPEWRITTER/
