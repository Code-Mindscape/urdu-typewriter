name: CI
on: [push, pull_request]

jobs:
  test-and-build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: 
          python-version: "3.12" 
          cache: pip

      - name: Install Linux System Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3 fonts-dejavu-core ghostscript

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      # Runs your verification suite uniformly across both systems
      - name: Run Tests
        env: { QT_QPA_PLATFORM: offscreen }
        run: |
          python -c "import glob, subprocess, sys; [subprocess.run([sys.executable, t], check=True) for t in glob.glob('test_*.py')]"

      # Linux Build Step: Pulls directly from your icons/ folder using standard colons (:)
      - name: Build Application (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          pyinstaller --name URDUTYPEWRITTER --windowed --onedir --clean --icon=icons/appicon.png --add-data "icons/appicon.png:icons" main.py

      # Windows Build Step: Pulls directly from your icons/ folder using semicolons (;)
      - name: Build Application (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller --name URDUTYPEWRITTER --windowed --onedir --clean --icon=icons/appicon.ico --add-data "icons/appicon.ico;icons" main.py

      # Compresses and saves the platform-specific output directory automatically
      - name: Upload Built Application
        uses: actions/upload-artifact@v4
        with:
          name: URDUTYPEWRITTER-${{ matrix.os }}
          path: dist/URDUTYPEWRITTER/
